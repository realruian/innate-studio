<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <script>
    // 在样式生效前就定好主题，避免打开时先闪一下深色。
    try {
      var saved = localStorage.getItem('seedance-studio.theme');
      if (saved === 'system') saved = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
    } catch { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <title>Innate Studio</title>
  <!-- 跟着浏览器自身的深浅色走，不跟应用内的主题开关：标签栏的底色由浏览器决定。 -->
  <link rel="icon" type="image/png" href="/src/brand/mark-on-light.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="/src/brand/mark-on-dark.png" media="(prefers-color-scheme: dark)">
</head>
<body spellcheck="false">
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="layer-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
